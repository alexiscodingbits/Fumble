name: Release

# Cuts a notarized DMG when a v* tag is pushed. Notarization activates only when the APPLE_*
# secrets are present; without them the job still builds and uploads an (unnotarized) DMG so the
# pipeline is testable before the Developer ID is set up.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app || true

      - name: Run tests
        run: |
          cd FumbleCore
          swift test

      - name: Import Developer ID certificate
        if: ${{ secrets.DEVELOPER_ID_P12 != '' }}
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$DEVELOPER_ID_P12" | base64 --decode > /tmp/cert.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm -f /tmp/cert.p12

      - name: Build DMG
        env:
          # When the cert is present, sign with the real Developer ID; otherwise bundle-app.sh
          # falls back (ad-hoc) and the DMG is unnotarized.
          CODESIGN_IDENTITY: ${{ secrets.DEVELOPER_ID_NAME }}
        run: bash scripts/make-dmg.sh

      - name: Notarize and staple
        if: ${{ secrets.AC_API_KEY_ID != '' }}
        env:
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
          AC_API_KEY: ${{ secrets.AC_API_KEY }}
        run: |
          echo "$AC_API_KEY" > /tmp/ac_key.p8
          DMG=$(ls dist/Fumble-*.dmg | head -1)
          xcrun notarytool submit "$DMG" \
            --key /tmp/ac_key.p8 \
            --key-id "$AC_API_KEY_ID" \
            --issuer "$AC_API_ISSUER_ID" \
            --wait
          xcrun stapler staple "$DMG"
          rm -f /tmp/ac_key.p8

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Fumble-*.dmg
          generate_release_notes: true
